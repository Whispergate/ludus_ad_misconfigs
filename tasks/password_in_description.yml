- name: Plant credentials in object description / info fields
  ansible.windows.win_powershell:
    script: |
      Import-Module ActiveDirectory
      $sam = "{{ item.user }}"
      $u = Get-ADUser -Filter "sAMAccountName -eq '$sam'" -ErrorAction SilentlyContinue
      if (-not $u) {
        Write-Host "WARNING: user '$sam' not found in AD – skipping description plant"
        exit 0
      }
      Set-ADUser -Identity $u -Description "{{ item.text }}"
      Write-Host "Description planted on $sam"
  loop: "{{ ludus_ad_password_in_description }}"
