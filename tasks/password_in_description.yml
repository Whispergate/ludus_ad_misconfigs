- name: Plant credentials in object description / info fields
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = "Stop"
      Import-Module ActiveDirectory
      Set-ADUser -Identity "{{ item.user }}" -Description "{{ item.text }}"
      Write-Host "Description planted on {{ item.user }}"
  loop: "{{ ludus_ad_password_in_description }}"
