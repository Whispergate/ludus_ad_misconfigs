- name: Configure AS-REP roastable accounts (disable Kerberos pre-auth)
  ansible.windows.win_powershell:
    script: |
      Import-Module ActiveDirectory
      $sam = "{{ item.user }}"
      $u = Get-ADUser -Filter "sAMAccountName -eq '$sam'" -ErrorAction SilentlyContinue
      if (-not $u) {
        Write-Host "WARNING: user '$sam' not found in AD – skipping AS-REP roasting setup"
        exit 0
      }
      Set-ADAccountControl -Identity $u -DoesNotRequirePreAuth $true
      if ("{{ item.password | default('') }}" -ne "") {
        Set-ADAccountPassword -Identity $u -Reset `
          -NewPassword (ConvertTo-SecureString "{{ item.password | default('') }}" -AsPlainText -Force)
      }
      Write-Host "AS-REP roastable: $sam"
  loop: "{{ ludus_ad_asreproast }}"
