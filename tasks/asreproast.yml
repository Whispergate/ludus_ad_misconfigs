- name: Configure AS-REP roastable accounts (disable Kerberos pre-auth)
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = "Stop"
      Import-Module ActiveDirectory
      Set-ADAccountControl -Identity "{{ item.user }}" -DoesNotRequirePreAuth $true
      # Note: Ansible renders this whole block with Jinja before PowerShell runs,
      # so the inner reference must also default - the PS `if` does not gate it.
      if ("{{ item.password | default('') }}" -ne "") {
        Set-ADAccountPassword -Identity "{{ item.user }}" -Reset `
          -NewPassword (ConvertTo-SecureString "{{ item.password | default('') }}" -AsPlainText -Force)
      }
      Write-Host "AS-REP roastable: {{ item.user }}"
  loop: "{{ ludus_ad_asreproast }}"
