# Shadow Credentials - grant a principal write over a victim's
# msDS-KeyCredentialLink attribute. Attacker adds a key credential (Whisker /
# pywhisker) and authenticates via PKINIT as the victim, recovering the NT hash.
- name: Configure Shadow Credentials (write msDS-KeyCredentialLink)
  ansible.windows.win_powershell:
    script: |
      Import-Module ActiveDirectory
      $principal = "{{ item.principal }}"
      $victim    = "{{ item.victim }}"

      try {
        $sid = (New-Object System.Security.Principal.NTAccount($principal)).Translate([System.Security.Principal.SecurityIdentifier])
      } catch {
        Write-Host "WARNING: principal '$principal' could not be resolved – skipping shadow credentials"
        exit 0
      }

      $obj = Get-ADObject -Filter "sAMAccountName -eq '$victim' -or sAMAccountName -eq '$victim$'" -ErrorAction SilentlyContinue
      if (-not $obj) {
        Write-Host "WARNING: victim '$victim' not found in AD – skipping shadow credentials"
        exit 0
      }
      $dn = $obj.DistinguishedName

      $schemaNC = (Get-ADRootDSE).schemaNamingContext
      $attr = Get-ADObject -SearchBase $schemaNC `
        -Filter "lDAPDisplayName -eq 'msDS-KeyCredentialLink'" -Properties schemaIDGUID
      if (-not $attr) {
        Write-Host "WARNING: msDS-KeyCredentialLink attribute not in schema – skipping shadow credentials"
        exit 0
      }
      $attrGuid = [GUID]$attr.schemaIDGUID

      $acl = Get-Acl -Path "AD:\$dn"
      $acl.AddAccessRule((New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
        $sid,[System.DirectoryServices.ActiveDirectoryRights]::WriteProperty,"Allow",$attrGuid)))
      Set-Acl -Path "AD:\$dn" -AclObject $acl
      Write-Host "Shadow Credentials: $principal can write msDS-KeyCredentialLink on $victim"
  loop: "{{ ludus_ad_shadow_credentials }}"
