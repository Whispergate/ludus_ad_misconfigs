# GPO abuse - grant a low-priv principal edit rights over an existing GPO.
# With GpoEditDeleteModifySecurity the principal can weaponize the GPO
# (SharpGPOAbuse / pyGPOAbuse) to run code on all linked computers/users.
- name: Grant edit rights on GPO
  ansible.windows.win_powershell:
    script: |
      Import-Module GroupPolicy
      Import-Module ActiveDirectory
      $principal = "{{ item.principal }}"
      $gpo       = "{{ item.gpo }}"
      $targetType = "{{ item.target_type | default('User') }}"

      try {
          Set-GPPermission -Name $gpo -TargetName $principal -TargetType $targetType `
            -PermissionLevel GpoEditDeleteModifySecurity
          Write-Host "GPO abuse: $principal granted edit rights on '$gpo' via Set-GPPermission"
      } catch {
          Write-Host "Set-GPPermission failed ($($_.Exception.Message)). Running as SYSTEM via scheduled task..."

          $markerOk  = "C:\Windows\Temp\gpo_acl_ok.txt"
          $markerErr = "C:\Windows\Temp\gpo_acl_err.txt"
          $scriptFile = "C:\Windows\Temp\gpo_acl.ps1"
          Remove-Item $markerOk -ErrorAction SilentlyContinue
          Remove-Item $markerErr -ErrorAction SilentlyContinue

          $scriptBody = @'
      try {
          Import-Module GroupPolicy
          Set-GPPermission -Name '~~GPO~~' -TargetName '~~PRINCIPAL~~' -TargetType '~~TARGETTYPE~~' `
            -PermissionLevel GpoEditDeleteModifySecurity -ErrorAction Stop
          'OK' | Out-File 'C:\Windows\Temp\gpo_acl_ok.txt'
      } catch {
          $_.Exception.Message | Out-File 'C:\Windows\Temp\gpo_acl_err.txt'
      }
      '@
          $scriptBody = $scriptBody -replace '~~GPO~~', ($gpo -replace "'", "''")
          $scriptBody = $scriptBody -replace '~~PRINCIPAL~~', ($principal -replace "'", "''")
          $scriptBody = $scriptBody -replace '~~TARGETTYPE~~', ($targetType -replace "'", "''")
          $scriptBody | Out-File -FilePath $scriptFile -Encoding UTF8

          $action = New-ScheduledTaskAction -Execute "powershell.exe" `
            -Argument "-NonInteractive -ExecutionPolicy Bypass -File $scriptFile"
          $taskPrincipal = New-ScheduledTaskPrincipal -UserId "SYSTEM" `
            -LogonType ServiceAccount -RunLevel Highest
          Register-ScheduledTask -TaskName "LudusGPOACL" `
            -Action $action -Principal $taskPrincipal -Force | Out-Null
          Start-ScheduledTask -TaskName "LudusGPOACL"

          $waited = 0
          while ($waited -lt 60) {
              Start-Sleep -Seconds 3
              $waited += 3
              $state = (Get-ScheduledTask -TaskName "LudusGPOACL").State
              if ($state -ne "Running") { break }
          }

          Unregister-ScheduledTask -TaskName "LudusGPOACL" -Confirm:$false -ErrorAction SilentlyContinue
          Remove-Item $scriptFile -Force -ErrorAction SilentlyContinue

          if (Test-Path $markerOk) {
              Remove-Item $markerOk -Force -ErrorAction SilentlyContinue
              Remove-Item $markerErr -Force -ErrorAction SilentlyContinue
              Write-Host "GPO abuse: $principal granted edit rights on '$gpo' via SYSTEM scheduled task"
          } elseif (Test-Path $markerErr) {
              $errMsg = Get-Content $markerErr -Raw
              Remove-Item $markerErr -Force -ErrorAction SilentlyContinue
              throw "SYSTEM scheduled task failed: $errMsg"
          } else {
              throw "SYSTEM scheduled task produced no output (timeout or crash)"
          }
      }
  loop: "{{ ludus_ad_gpo_abuse }}"
