- name: Set weak / known passwords (password spraying targets)
  ansible.windows.win_powershell:
    script: |
      Import-Module ActiveDirectory
      $sam = "{{ item.user }}"
      $u = Get-ADUser -Filter "sAMAccountName -eq '$sam'" -ErrorAction SilentlyContinue
      if (-not $u) {
        Write-Host "WARNING: user '$sam' not found in AD – skipping weak password set"
        exit 0
      }
      Set-ADAccountPassword -Identity $u -Reset `
        -NewPassword (ConvertTo-SecureString "{{ item.password }}" -AsPlainText -Force)
      if ("{{ item.never_expires | default(true) }}" -eq "True") {
        Set-ADUser -Identity $u -PasswordNeverExpires $true
      }
      Write-Host "Weak password set: $sam"
  loop: "{{ ludus_ad_weak_passwords }}"
  no_log: true
