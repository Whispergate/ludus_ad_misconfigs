- name: Set weak / known passwords (password spraying targets)
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = "Stop"
      Import-Module ActiveDirectory
      Set-ADAccountPassword -Identity "{{ item.user }}" -Reset `
        -NewPassword (ConvertTo-SecureString "{{ item.password }}" -AsPlainText -Force)
      if ("{{ item.never_expires | default(true) }}" -eq "True") {
        Set-ADUser -Identity "{{ item.user }}" -PasswordNeverExpires $true
      }
      Write-Host "Weak password set: {{ item.user }}"
  loop: "{{ ludus_ad_weak_passwords }}"
  no_log: true
