- name: Configure Kerberoastable accounts (set SPN)
  ansible.windows.win_powershell:
    script: |
      Import-Module ActiveDirectory
      $sam = "{{ item.user }}"
      $u = Get-ADUser -Filter "sAMAccountName -eq '$sam'" -ErrorAction SilentlyContinue
      if (-not $u) {
        Write-Host "WARNING: user '$sam' not found in AD – skipping kerberoasting setup"
        exit 0
      }
      Set-ADUser -Identity $u -ServicePrincipalNames @{Add="{{ item.spn }}"}
      if ("{{ item.password | default('') }}" -ne "") {
        Set-ADAccountPassword -Identity $u -Reset `
          -NewPassword (ConvertTo-SecureString "{{ item.password | default('') }}" -AsPlainText -Force)
      }
      Write-Host "Kerberoastable: $sam SPN={{ item.spn }}"
  loop: "{{ ludus_ad_kerberoasting }}"
