- name: Grant DCSync rights (DS-Replication-Get-Changes*)
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = "Stop"
      Import-Module ActiveDirectory
      $principal = New-Object System.Security.Principal.NTAccount("{{ item.principal }}")
      $sid = $principal.Translate([System.Security.Principal.SecurityIdentifier])

      # Extended-right GUIDs
      $getChanges     = [GUID]"1131f6aa-9c07-11d1-f79f-00c04fc2dcd2"
      $getChangesAll  = [GUID]"1131f6ad-9c07-11d1-f79f-00c04fc2dcd2"
      $getChangesFilt = [GUID]"89e95b76-444d-4c62-991a-0facbeda640c"

      $domainDN = (Get-ADDomain).DistinguishedName
      $drive = "AD:\$domainDN"
      $acl = Get-Acl -Path $drive
      foreach ($guid in @($getChanges, $getChangesAll, $getChangesFilt)) {
        $ace = New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
          $sid, "ExtendedRight", "Allow", $guid)
        $acl.AddAccessRule($ace)
      }
      Set-Acl -Path $drive -AclObject $acl
      Write-Host "DCSync rights granted to {{ item.principal }}"
  loop: "{{ ludus_ad_dcsync }}"
