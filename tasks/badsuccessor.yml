# BadSuccessor (Akamai, 2025) - dMSA privilege escalation, Windows Server 2025 domains.
# Grants a low-priv principal CreateChild rights for the
# msDS-DelegatedManagedServiceAccount class over an OU/container. That principal
# can then create a dMSA, set msDS-ManagedAccountPrecededByLink to any account and
# msDS-DelegatedMSAState=2, and authenticate as that account (SharpSuccessor/bloodyAD).
- name: Configure BadSuccessor (dMSA CreateChild delegation over OU)
  ansible.windows.win_powershell:
    script: |
      Import-Module ActiveDirectory

      $principal = "{{ item.principal }}"
      $ouDN      = "{{ item.ou }}"

      try {
        $sid = (New-Object System.Security.Principal.NTAccount($principal)).Translate([System.Security.Principal.SecurityIdentifier])
      } catch {
        Write-Host "WARNING: principal '$principal' could not be resolved – skipping BadSuccessor"
        exit 0
      }

      if (-not (Get-ADObject -Filter "distinguishedName -eq '$ouDN'" -ErrorAction SilentlyContinue)) {
        Write-Host "WARNING: OU '$ouDN' not found in AD – skipping BadSuccessor"
        exit 0
      }

      $schemaNC = (Get-ADRootDSE).schemaNamingContext
      $dmsaClass = Get-ADObject -SearchBase $schemaNC `
        -Filter "lDAPDisplayName -eq 'msDS-DelegatedManagedServiceAccount'" `
        -Properties schemaIDGUID -ErrorAction SilentlyContinue
      if (-not $dmsaClass) {
        Write-Host "WARNING: dMSA class not in schema (requires Server 2025 domain) – skipping BadSuccessor"
        exit 0
      }
      $dmsaGuid = [GUID]$dmsaClass.schemaIDGUID

      $acl = Get-Acl -Path "AD:\$ouDN"
      $ace = New-Object System.DirectoryServices.ActiveDirectoryAccessRule(
        $sid,
        ([System.DirectoryServices.ActiveDirectoryRights]::CreateChild -bor
         [System.DirectoryServices.ActiveDirectoryRights]::DeleteChild),
        "Allow", $dmsaGuid, "All")
      $acl.AddAccessRule($ace)
      Set-Acl -Path "AD:\$ouDN" -AclObject $acl
      Write-Host "BadSuccessor: $principal can create dMSA objects under $ouDN"
  loop: "{{ ludus_ad_badsuccessor }}"
