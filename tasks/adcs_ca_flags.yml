# CA-wide AD CS misconfigurations set via certutil registry (ESC6, ESC11, ESC16).
# Runs on the CA server. Restarts CertSvc so changes take effect.
- name: Apply CA-wide AD CS misconfigurations
  ansible.windows.win_powershell:
    script: |
      $ErrorActionPreference = "Stop"
      # Skip when AD CS (CertSvc) is not installed on this host
      if (-not (Get-Service CertSvc -ErrorAction SilentlyContinue)) {
        Write-Host "WARNING: AD CS not installed on this host. Skipping CA flag {{ item.esc }}."
        return
      }
      # Resolve CA config string "<host>\<CAName>"
      $caName = "{{ item.ca | default('') }}"
      if ($caName -eq '') {
        # Select-String returns MatchInfo objects; take the matched line as a
        # single string before Trim so this never lands on an object array.
        $caLine = certutil | Select-String 'Name:' | Select-Object -First 1 -ExpandProperty Line
        $caName = ([string]$caLine) -replace '.*Name:\s*',''
        $caName = $caName.Trim().Trim('"')
      }
      # $host is a reserved automatic variable in PowerShell; use our own name.
      $caHost = $env:COMPUTERNAME
      $cfg  = "$caHost\$caName"
      $esc  = "{{ item.esc }}"   # esc6 | esc11 | esc16

      switch ($esc) {
        'esc6' {
          # EDITF_ATTRIBUTESUBJECTALTNAME2 (0x00040000): SAN honored on any template
          certutil -config $cfg -setreg policy\EditFlags +EDITF_ATTRIBUTESUBJECTALTNAME2
        }
        'esc11' {
          # Clear IF_ENFORCEENCRYPTICERTREQUEST (0x200): allow unencrypted ICertRequest RPC
          certutil -config $cfg -setreg CA\InterfaceFlags -IF_ENFORCEENCRYPTICERTREQUEST
        }
        'esc16' {
          # Add szOID_NTDS_CA_SECURITY_EXT (SID binding) to DisableExtensionList
          certutil -config $cfg -setreg policy\DisableExtensionList +1.3.6.1.4.1.311.25.2
        }
        default { throw "Unknown esc type: $esc" }
      }
      # CertSvc can briefly refuse to start right after a certutil -setreg
      # (the SCM returns "Cannot start service" while the CA is still settling).
      # Retry the restart, then fall back to a plain start.
      $restarted = $false
      for ($i = 0; $i -lt 6; $i++) {
        try {
          Restart-Service certsvc -Force -ErrorAction Stop
          $restarted = $true
          break
        } catch {
          Start-Sleep -Seconds 10
        }
      }
      if (-not $restarted) {
        Start-Service certsvc -ErrorAction SilentlyContinue
      }
      Write-Host "Applied $esc on CA $cfg"
  loop: "{{ ludus_ad_adcs_ca_flags }}"
